<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coco-egg</title>
<style>
  /* The student view is a renderer of presentation.CUES and holds no colours
     of its own — every hue, period and dwell arrives from /cues, which is the
     same table the M1 LED driver reads. Motion is the load-bearing channel:
     no two states share one, so the ring stays readable with colour switched
     off (colour blindness, daylight on a diffuser, GPO pins). */
  :root { --cue: #5A4632; --ring: 260px; --stroke: 14px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #12100E; color: #E8E0D4; overflow: hidden;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center;
  }

  /* --- student view ------------------------------------------------------ */
  #stage { display: grid; place-items: center; gap: 28px; }
  #ringwrap { width: calc(var(--ring) * .76); height: var(--ring); position: relative; }
  svg {
    width: 100%; height: 100%; overflow: visible;
    /* The glow lives on the <svg> element, not on <circle>. An SVG child's
       filter clips to the filter region, which drew the halo as a visible
       lighter SQUARE around the ring. */
    filter: drop-shadow(0 0 18px color-mix(in srgb, var(--cue) 45%, transparent));
  }
  path { fill: none; stroke-width: var(--stroke); stroke-linejoin: round; }
  #track { stroke: #ffffff10; }
  #ring { stroke: var(--cue); }
  #label {
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: #ffffff55; min-height: 1.2em;
  }
  #prompt {
    font-size: 13px; color: #ffffff44; min-height: 1.4em; letter-spacing: .04em;
  }
  #prompt.flash { color: #E0A020; }
  #ringwrap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #said {
    max-width: 34ch; text-align: center; color: #ffffffcc; min-height: 3em;
    font-size: 18px;
  }

  /* One animation per motion. Durations come from period_ms at runtime. */
  .breathe #ring { animation: breathe var(--period) ease-in-out infinite; }
  .pulse   #ring { animation: pulse   var(--period) ease-in-out infinite; }
  .steady  #ring { opacity: 1; }
  .sigh    #ring { animation: sigh    var(--period) ease-out 1 both; }
  .nudge   #ringwrap { animation: nudge var(--period) ease-in-out infinite; }
  /* fill is driven by stroke-dashoffset in JS: it grows toward the ring and
     never closes it, so an overrun visibly slows instead of sitting at 100%. */

  @keyframes breathe { 0%,100% { opacity:.45; stroke-width:calc(var(--stroke)*.8) }
                       50%     { opacity:.95; stroke-width:var(--stroke) } }
  @keyframes pulse   { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  @keyframes sigh    { 0% { opacity:.9 } 100% { opacity:.15 } }
  @keyframes nudge   { 0%,100% { transform:translateX(0) }
                       25% { transform:translateX(-7px) } 75% { transform:translateX(7px) } }

  /* --- dev view ---------------------------------------------------------- */
  #dev {
    position: fixed; inset: 0 0 0 auto; width: min(560px, 100%);
    background: #0C0B09; border-left: 1px solid #ffffff14;
    transform: translateX(100%); transition: transform .18s ease;
    display: flex; flex-direction: column;
  }
  body.dev #dev { transform: none; }
  #devhead {
    padding: 12px 16px; border-bottom: 1px solid #ffffff14;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #turns { overflow-y: auto; padding: 12px 16px 32px; flex: 1; }
  .turn { border-top: 1px solid #ffffff10; padding: 12px 0; }
  .turn:first-child { border-top: 0; }
  .heard { font-size: 16px; color: #fff; margin-bottom: 6px; }
  .heard::before { content: "› "; color: #ffffff44; }
  .reply { color: #9FD0F0; margin: 4px 0 8px; }
  .meta { color: #ffffff66; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
  td { padding: 2px 6px 2px 0; color: #ffffff88; }
  td.score { text-align: right; font-variant-numeric: tabular-nums; }
  tr.kept td { color: #7FE0A8; }
  tr.cut td { color: #ffffff44; }
  .stages { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .stage {
    font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: #ffffff0d; color: #ffffff99; font-variant-numeric: tabular-nums;
  }
  .stage.slow { background: #E0A02022; color: #E0A020; }
  .warn { color: #E0A020; }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #ffffff0d; color: #ffffff88;
  }
  .pill.live { background: #3FBF6F22; color: #3FBF6F; }
  .pill.down { background: #B4726A22; color: #B4726A; }
  .pill.risk { background: #B4726A22; color: #D9A09A; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: #ffffff12; color: #ffffff88;
  }
  #stage { transition: transform .18s ease; }
  @media (min-width: 900px) {
    body.dev #stage { transform: translateX(-280px) scale(.86); }
  }
  #hint { position: fixed; bottom: 14px; left: 16px; color: #ffffff33; font-size: 12px; }
  /* The egg may have no speaker at all, so this is the speaker. It has to be a
     real tap: no browser autoplays audio without a gesture, which is why this
     is a button and not a setting that could be on by default. */
  #usemic {
    position: fixed; top: 14px; left: 16px; z-index: 6;
    font: inherit; font-size: 12px; padding: 8px 14px; border-radius: 999px;
    background: #ffffff0d; color: #ffffff88; border: 1px solid #ffffff1f;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #usemic[aria-pressed="true"] { background: #3FBF6F22; color: #7FE0A8; border-color: #3FBF6F55; }
  #usemic:focus-visible, #listen:focus-visible { outline: 2px solid #3FA0E0; outline-offset: 2px; }
  #listen {
    position: fixed; top: 14px; right: 16px; z-index: 6;
    font: inherit; font-size: 12px; padding: 8px 14px; border-radius: 999px;
    background: #ffffff0d; color: #ffffff88; border: 1px solid #ffffff1f;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #listen[aria-pressed="true"] { background: #3FA0E022; color: #9FD0F0; border-color: #3FA0E055; }
  #listen:focus-visible { outline: 2px solid #3FA0E0; outline-offset: 2px; }
  #listen.playing { border-color: #3FA0E0; }
</style>

<div id="stage">
  <div id="ringwrap">
    <svg viewBox="0 0 120 120">
      <path id="track" d="M 60 6 C 79 6, 98 38, 98 68 C 98 95, 82 114, 60 114 C 38 114, 22 95, 22 68 C 22 38, 41 6, 60 6 Z"></path>
      <path id="ring"  d="M 60 6 C 79 6, 98 38, 98 68 C 98 95, 82 114, 60 114 C 38 114, 22 95, 22 68 C 22 38, 41 6, 60 6 Z"></path>
    </svg>
  </div>
  <div id="label">idle</div>
  <div id="prompt"></div>
  <div id="said"></div>
</div>

<div id="dev">
  <div id="devhead">
    <strong>trace</strong>
    <span id="conn" class="pill down">connecting</span>
    <span id="drops" class="pill" hidden></span>
    <span class="pill risk">no auth · live only</span>
    <span style="margin-left:auto"><kbd>d</kbd> close</span>
  </div>
  <div id="turns"></div>
</div>

<button id="usemic" aria-pressed="false">use this phone's mic</button>
<button id="listen" aria-pressed="false">listen on this phone</button>

<div id="hint"><kbd>space</kbd> talk &nbsp;·&nbsp; <kbd>d</kbd> dev trace</div>

<script>
const $ = (s) => document.querySelector(s);
const CIRC = $("#ring").getTotalLength();   // measured, so reshaping the egg is safe
let CUES = {};
let turns = new Map();
let dwellUntil = 0, pending = null, exitTimer = null, fillTimer = null;
let uiState = "IDLE", flashTimer = null;

$("#ring").style.strokeDasharray = CIRC;
$("#ring").style.strokeDashoffset = 0;

fetch("/cues").then(r => r.json()).then(t => { CUES = t; paint("IDLE"); });

/* min_dwell_ms is not cosmetic: a fully-degraded turn can run start-to-end in
   milliseconds, and with no floor the ring strobes through four states inside
   one frame. A cue arriving too early is held, not dropped. */
function show(state) {
  const now = performance.now();
  if (now < dwellUntil) { pending = state; return; }
  paint(state);
}

function paint(state) {
  const cue = CUES[state] || CUES.IDLE;
  if (!cue) return;
  const stage = $("#stage"), ring = $("#ring");
  clearTimeout(exitTimer); clearInterval(fillTimer);

  stage.className = "";                       // drop the previous motion
  ring.style.strokeDashoffset = 0;
  void stage.offsetWidth;                     // restart one-shot animations
  document.documentElement.style.setProperty("--cue", cue.colour);
  if (cue.period_ms) {
    document.documentElement.style.setProperty("--period", cue.period_ms + "ms");
  }
  stage.classList.add(cue.motion);
  $("#label").textContent = state.toLowerCase();
  uiState = state;
  showPrompt();

  if (cue.motion === "fill") growTowardsTheRing(cue.period_ms);
  dwellUntil = performance.now() + (cue.min_dwell_ms || 0);
  if (cue.exit_ms) exitTimer = setTimeout(() => show("IDLE"), cue.exit_ms);
  setTimeout(() => { if (pending) { const p = pending; pending = null; show(p); } },
             cue.min_dwell_ms || 0);
}

/* Asymptotic on purpose. THINKING's period is the median time-to-first-audio,
   so a normal turn is one near-lap; a slow one keeps creeping instead of
   hitting 100% and sitting there looking stuck. */
function growTowardsTheRing(periodMs) {
  const t0 = performance.now();
  fillTimer = setInterval(() => {
    const frac = 1 - Math.exp(-(performance.now() - t0) / (periodMs || 5000));
    $("#ring").style.strokeDashoffset = CIRC * (1 - 0.92 * frac);
  }, 40);
}

/* --- dev trace ---------------------------------------------------------- */
function turnCard(id) {
  if (turns.has(id)) return turns.get(id);
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `<div class="heard"></div><div class="chunks"></div>
                  <div class="reply"></div><div class="stages"></div>
                  <div class="outcome meta"></div>`;
  $("#turns").prepend(el);
  turns.set(id, el);
  while (turns.size > 30) {                   // a browser left open all day
    const oldest = Math.min(...turns.keys());
    turns.get(oldest).remove(); turns.delete(oldest);
  }
  return el;
}

function renderChunks(el, ev) {
  const rows = (ev.chunks || []).map(c => `
    <tr class="${c.kept ? "kept" : "cut"}">
      <td>${c.kept ? "▸" : " "}</td><td>${esc(c.id)}</td>
      <td class="score">${(c.score ?? 0).toFixed(3)}</td>
      <td>${c.lexical_bonus ? "+lex" : ""}</td>
    </tr>`).join("");
  el.querySelector(".chunks").innerHTML = rows
    ? `<table>${rows}</table><div class="meta">${esc(ev.path)} · floor ${ev.floor}</div>`
    : `<div class="meta">retrieved nothing</div>`;
}

const esc = (s) => String(s ?? "").replace(/[<>&]/g, c => (
  { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

function handle(ev) {
  if (ev.dropped) {
    $("#drops").hidden = false;
    $("#drops").textContent = ev.dropped + " dropped";
  }
  const card = () => turnCard(ev.turn);
  switch (ev.kind) {
    case "state":
      show(ev.state);
      if (ev.state === "LISTENING") $("#said").textContent = "";
      break;
    case "audio": {
      // Loud enough to be a question? rms near the floor means it never was,
      // whatever the transcript ends up claiming.
      const weak = ev.rms < ev.floor * 3;
      card().querySelector(".chunks").insertAdjacentHTML("beforebegin",
        `<div class="meta${weak ? " warn" : ""}">mic ${ev.seconds}s ·`
        + ` rms ${ev.rms} (floor ${ev.floor}) · peak ${ev.peak}`
        + `${weak ? " — barely above silence" : ""}</div>`);
      break;
    }
    case "heard":
      $("#said").textContent = ev.text || "";
      card().querySelector(".heard").textContent = ev.text || "(nothing)";
      break;
    case "retrieved": renderChunks(card(), ev); break;
    case "opener":
    case "topic":
      card().querySelector(".chunks").innerHTML =
        `<div class="meta">${ev.kind === "opener" ? "opener" : "new subject"}` +
        ` — not grounded</div>`;
      break;
    case "spoken":
      enqueue(ev.clip);
      break;
    case "sentence": {
      const r = card().querySelector(".reply");
      r.textContent = (r.textContent + " " + (ev.text || "")).trim();
      break;
    }
    case "stage": {
      const slow = ev.seconds >= 3;
      card().querySelector(".stages").insertAdjacentHTML("beforeend",
        `<span class="stage ${slow ? "slow" : ""}">${esc(ev.stage)} ${ev.seconds}s</span>`);
      break;
    }
    case "degraded":
      card().querySelector(".outcome").insertAdjacentHTML("beforeend",
        `<div class="warn">degraded: ${esc(ev.component)} → ${esc(ev.fallback)}</div>`);
      break;
    case "error":
      card().querySelector(".outcome").insertAdjacentHTML("beforeend",
        `<div class="warn">${esc(ev.error)}: ${esc(ev.message)}</div>`);
      show("ERROR");
      // A microphone can be unplugged mid-demo, and asking only at page load
      // means the page keeps sending turns to a device mic that has gone away.
      // Re-ask on any failure: this is the moment the answer may have changed.
      checkMic();
      break;
    case "turn.end":
      if (ev.reason === "no-audio" || ev.reason === "no-speech") show("UNHEARD");
      card().querySelector(".outcome").insertAdjacentHTML("beforeend",
        `<div>${esc(ev.reason)}${ev.latency_s ? " · " + Number(ev.latency_s).toFixed(1) + "s to first audio" : ""}</div>`);
      break;
  }
}

/* EventSource reconnects on its own, which is what we want on a device that
   may restart under the browser. The page shows IDLE until the first real
   state event — a tab opened mid-turn corrects itself within one turn. */
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { $("#conn").textContent = "live"; $("#conn").className = "pill live"; };
  es.onerror = () => { $("#conn").textContent = "reconnecting"; $("#conn").className = "pill down"; };
  es.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (e) { console.warn(e); } };
}
connect();

/* Space here does what Enter does in the terminal, and goes through the same
   queue on the device (trigger.py) — the console is not a second route into
   the loop, it is a second caller of the one route. */
function flash(msg) {
  const el = $("#prompt");
  el.textContent = msg;
  el.classList.add("flash");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.classList.remove("flash"); showPrompt(); }, 1600);
}

function showPrompt() {
  if (flashTimer && $("#prompt").classList.contains("flash")) return;
  $("#prompt").textContent = uiState === "IDLE" ? "press space to talk" : "";
}

/* Tapping the egg records HERE when the browser can open a microphone, and
   otherwise asks the device to use its own. Same turn either way — the audio
   just enters the pipeline through /listen instead of the mic. */
async function talk() {
  if (micCtx) { micStop(); return; }          // tap again to send early
  if (useMyMic()) { micStart(); return; }
  try {
    const r = await fetch("/trigger", { method: "POST" });
    if (r.status === 409) flash("still answering\u2026");
  } catch {
    flash("device unreachable");
  }
}

function useMyMic() {
  return $("#usemic").getAttribute("aria-pressed") === "true";
}

/* --- the phone as the microphone -----------------------------------------
   Raw PCM, not MediaRecorder. MediaRecorder yields WebM/Opus on Chrome and
   MP4/AAC on Safari, neither of which whisper-server reads, so it would mean a
   transcode on the Pi. Capturing float samples and writing the WAV header here
   sends exactly the 16 kHz mono the pipeline already expects.

   Recording stops on silence rather than on a second tap, mirroring the
   device's own silence_stop_s, so a stranger who taps once and speaks gets the
   same behaviour they would get from the egg's own microphone. */
const MIC = {
  RATE: 16000,
  SILENCE_RMS: 0.005,      // the device's audio.silence_rms
  SILENCE_MS: 1100,        // the device's silence_stop_s
  NO_SPEECH_MS: 4000,      // the device's no_speech_s
  MAX_MS: 15000,
};

let micStream = null, micCtx = null, micNode = null, micSource = null;
let micChunks = [], micRate = 48000, micVoiced = false;
let micQuietSince = 0, micStarted = 0, micStopping = false;

function wavBlob(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buf);
  const str = (off, s) => [...s].forEach((c, i) => view.setUint8(off + i, c.charCodeAt(0)));
  str(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, "data"); view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* Average rather than pick every Nth sample: decimation without a filter
   aliases, and on a phone in a noisy room that shows up as hiss the ASR then
   has to see through. */
function downsample(chunks, from, to) {
  const flat = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
  let at = 0;
  for (const c of chunks) { flat.set(c, at); at += c.length; }
  if (from === to) return flat;
  const ratio = from / to;
  const out = new Float32Array(Math.floor(flat.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio), end = Math.min(flat.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += flat[j];
    out[i] = sum / Math.max(1, end - start);
  }
  return out;
}

async function micStart() {
  if (micCtx) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    // The usual cause is not a permission but the page being served over
    // plain HTTP: getUserMedia does not exist outside a secure context.
    flash(location.protocol === "https:" ? "no microphone" : "needs https");
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
    });
  } catch (e) {
    // Name the cause. "blocked" covers three different problems with three
    // different fixes, and guessing between them from the far end of an SSH
    // session is exactly how an afternoon disappears.
    const why = {
      // Safari also throws this for a site it does not consider trustworthy,
      // which a self-signed certificate is — accepting the warning lets the
      // page load but does not always earn permission for the microphone.
      NotAllowedError: "mic denied — Safari: aA menu > Website Settings > Microphone > Allow",
      NotFoundError: "no microphone on this phone",
      NotReadableError: "mic busy in another app",
      SecurityError: "blocked: certificate not trusted for mic",
      AbortError: "mic could not start",
    }[e && e.name] || `mic error: ${(e && e.name) || "unknown"}`;
    flash(why);
    return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  micRate = micCtx.sampleRate;
  micSource = micCtx.createMediaStreamSource(micStream);
  // ScriptProcessorNode is deprecated but works on every phone we care about,
  // including older iOS Safari. An AudioWorklet would need a separate module
  // file served alongside the page for no behavioural gain here.
  micNode = micCtx.createScriptProcessor(4096, 1, 1);
  micChunks = []; micVoiced = false; micStopping = false;
  micStarted = performance.now(); micQuietSince = micStarted;

  micNode.onaudioprocess = (e) => {
    if (micStopping) return;
    const input = e.inputBuffer.getChannelData(0);
    micChunks.push(new Float32Array(input));
    let sum = 0;
    for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
    const rms = Math.sqrt(sum / input.length);
    const now = performance.now();

    if (rms >= MIC.SILENCE_RMS) { micVoiced = true; micQuietSince = now; }
    // Same two timers the device uses: one for an utterance that ended, one
    // for an utterance that never began.
    if (micVoiced && now - micQuietSince > MIC.SILENCE_MS) micStop();
    else if (!micVoiced && now - micStarted > MIC.NO_SPEECH_MS) micStop(true);
    else if (now - micStarted > MIC.MAX_MS) micStop();
  };
  micSource.connect(micNode);
  micNode.connect(micCtx.destination);
  show("LISTENING");
  $("#prompt").textContent = "listening… speak now";
}

function micStop(nothingHeard) {
  if (micStopping || !micCtx) return;
  micStopping = true;
  const chunks = micChunks, from = micRate;
  try { micSource.disconnect(); micNode.disconnect(); } catch {}
  micStream.getTracks().forEach((t) => t.stop());
  micCtx.close();
  micCtx = micNode = micSource = micStream = null;
  micChunks = [];

  if (nothingHeard || !chunks.length) {
    show("UNHEARD");
    flash("didn't catch that");
    return;
  }
  const blob = wavBlob(downsample(chunks, from, MIC.RATE), MIC.RATE);
  $("#prompt").textContent = "thinking…";
  fetch("/listen", { method: "POST", body: blob,
                     headers: { "Content-Type": "audio/wav" } })
    .then((r) => { if (r.status === 409) flash("still answering…"); })
    .catch(() => flash("device unreachable"));
}

/* --- the phone as the speaker -------------------------------------------
   Sentences arrive one at a time and must not overlap, so they queue rather
   than each calling play(). A clip that 404s has aged out of the device's ring
   buffer -- skip it and keep the rest of the answer going, because losing one
   sentence beats stalling the queue behind it.

   fetch + Web Audio rather than an <audio src>, for one iOS-specific reason:
   a media element loads through AVFoundation, which does NOT share Safari's
   certificate exception. On a self-signed console that means the page renders
   perfectly and every clip fails, which is indistinguishable from the device
   being silent. fetch() goes through Safari's own network stack, where the
   exception the user accepted actually applies. */
let listening = false;
const queue = [];
let playing = false;
let actx = null;
let source = null;

function audioReady() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!actx) {
    actx = new AC();
    // iOS wants a buffer to have actually played, not merely a resumed
    // context, so play one silent frame while we still hold the gesture.
    const s = actx.createBufferSource();
    s.buffer = actx.createBuffer(1, 1, 22050);
    s.connect(actx.destination);
    s.start(0);
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}

function enqueue(clip) {
  if (!listening || !clip) return;
  queue.push(`/clip/${clip}.wav`);
  if (!playing) playNext();
}

async function playNext() {
  const url = queue.shift();
  if (!url) { playing = false; $("#listen").classList.remove("playing"); return; }
  playing = true;
  $("#listen").classList.add("playing");
  try {
    const ctx = audioReady();
    if (!ctx) throw new Error("no web audio");
    const r = await fetch(url);
    if (!r.ok) throw new Error("clip " + r.status);
    const buf = await ctx.decodeAudioData(await r.arrayBuffer());
    source = ctx.createBufferSource();
    source.buffer = buf;
    source.connect(ctx.destination);
    source.onended = () => { source = null; playNext(); };
    source.start();
  } catch (e) {
    // Loud, not silent. The previous version skipped a failed clip without a
    // word, so a phone that played nothing looked like a network fault and
    // sent an evening into checking the network instead of the audio.
    flash("audio: " + ((e && e.message) || "failed"));
    playNext();
  }
}

function setListen(on) {
  listening = on;
  const b = $("#listen");
  b.setAttribute("aria-pressed", String(on));
  b.textContent = on ? "listening" : "listen on this phone";
  if (!on) {
    queue.length = 0;
    playing = false;
    if (source) { try { source.stop(); } catch {} source = null; }
    b.classList.remove("playing");
  }
}

$("#listen").addEventListener("click", () => {
  const on = !listening;
  setListen(on);
  if (on) audioReady();          // the unlock has to happen in THIS gesture
});

function setUseMic(on) {
  $("#usemic").setAttribute("aria-pressed", String(on));
  $("#usemic").textContent = on ? "using this phone's mic" : "use this phone's mic";
}

$("#usemic").addEventListener("click", async () => {
  const on = $("#usemic").getAttribute("aria-pressed") !== "true";
  if (on && location.protocol !== "https:") {
    // Worth saying plainly rather than letting the tap silently do nothing:
    // this is a browser rule, not a device setting.
    flash("needs https for mic");
    return;
  }
  setUseMic(on);
});

/* If the egg has no microphone, this phone is the only one in the room, so
   default to it. Otherwise the obvious first action — tap the egg — fails with
   a hardware error a visitor holding a phone cannot do anything about.
   Permission is still requested on the tap, which is the user gesture Safari
   wants; this only decides where the tap sends us.

   Asked again after every failure, not just at load: a USB mic can be
   unplugged mid-demo, and the device only finds out by trying to record. */
function checkMic() {
  return fetch("/health")
    .then((r) => r.json())
    .then((h) => {
      if (h.mic === false && !useMyMic() && location.protocol === "https:") {
        setUseMic(true);
        flash("no mic on the egg — using this phone's");
      }
    })
    .catch(() => {});
}
checkMic();

$("#ringwrap").addEventListener("click", talk);   // tap works on a tablet too

addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); talk(); return; }
  if (e.key === "d" || e.key === "D") document.body.classList.toggle("dev");
});
</script>
