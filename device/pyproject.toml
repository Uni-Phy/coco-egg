[project]
name = "coco-egg"
version = "0.1.0"
description = "coco-egg zero: offline-first edge voice tutor (CoCo / CommonCompute)"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "requests>=2.31",
    "pyyaml>=6.0",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["coco_egg*"]

[tool.ruff]
line-length = 100
