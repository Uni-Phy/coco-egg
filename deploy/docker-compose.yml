services:
  llama-tutor:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      # Which model is live comes from deploy/.env (gitignored, written by
      # `make model-use`) so a bench and a device can differ without a code
      # change. The default here is what ships — see models.json.
      - -m
      - /models/${TUTOR_MODEL:-Qwen3-1.7B-Q4_K_M.gguf}
      - --port
      - "8080"
      - -c
      - "2048"
      - --reasoning-budget
      - "0"
    volumes:
      - ../models:/models:ro
    ports:
      - "8080:8080" # host-side debugging (curl /health)
    restart: unless-stopped
    # llama-server grows ~11MB per varied request and never gives it back
    # (984MB fresh -> 5.8GB after 11h on the bench; docs/model-notes.md §8).
    # The Pi has 8GB and no swap, so cap it and let restart:unless-stopped
    # recycle the container instead of the kernel picking a victim. Bounds the
    # blast radius; it does not fix the leak.
    mem_limit: 3g

  llama-embed:
    # bge-small embedding server for semantic retrieval (tutor/embed.py).
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/bge-small-en-v1.5-f16.gguf
      - --port
      - "8082"
      - --embedding
      - --pooling
      - cls
      - -c
      - "512"
    volumes:
      - ../models:/models:ro
    ports:
      - "8082:8082"
    # The upstream image hardcodes its healthcheck to port 8080, so an embed
    # server on 8082 reports unhealthy forever while working perfectly. Point
    # it at the port this container actually listens on.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  whisper:
    # Upstream publishes amd64 only; build locally so arm64 hosts (Raspberry
    # Pi) work. ENTRYPOINT is whisper-server; command supplies its flags.
    image: coco-whisper:dev
    build: { context: ., dockerfile: whisper.Dockerfile}
    command: ["--host", "0.0.0.0", "--port", "8081", "-m", "/models/ggml-base.en.bin"]
    volumes:
      - ../models:/models:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

  egg:
    container_name: egg
    image: coco-egg:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    depends_on: [llama-tutor, llama-embed, whisper]
    devices: ["/dev/snd:/dev/snd"]
    ports:
      - "8090:8090"             # console: student view + dev trace (no auth yet)
    stdin_open: true            # keyboard trigger reads stdin via input()
    tty: true
    # `docker attach` fools stdout into block-buffering; force flush per line.
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../device:/app/device                # editable install -> host edits + `make restart` reload
      - ../fixtures:/app/fixtures:ro
      - ../tools:/app/tools:ro               # eval harness, to verify a deploy
      - ../models:/app/models:ro
      - ../transcripts:/app/transcripts
      - ../state:/app/state                  # derived profile + embedding cache
      - ../egg.yaml:/app/egg.yaml:ro
    restart: unless-stopped
