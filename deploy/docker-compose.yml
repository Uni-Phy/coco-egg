services:
  egg:
    image: coco-egg:dev
    build: { context: .., dockerfile: deploy/Dockerfile }
    network_mode: host          # reach host llama-server on 127.0.0.1:8080
    devices: ["/dev/snd:/dev/snd"]
    stdin_open: true            # keyboard trigger reads stdin via input()
    tty: true
    volumes:
      - ../device:/app/device                # editable install -> host edits + `make restart` reload
      - ../fixtures:/app/fixtures:ro
      - ../models:/app/models:ro
      - ../transcripts:/app/transcripts
      - ../egg.yaml:/app/egg.yaml:ro
    restart: unless-stopped
